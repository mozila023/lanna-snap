<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lanna Snap · ล้านนาสแนป</title>
<meta name="theme-color" content="#17121f">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="scrLogin" class="scr">
    <div class="loginBox">
      <div class="logo"><span class="l1">ล้านนา</span><span class="l2">SNAP</span><small>การ์ดเกม 9 จังหวัดภาคเหนือ</small></div>
      <button id="btnGoogle" class="btn primary" type="button">เข้าสู่ระบบด้วย Google</button>
      <button id="btnGuest" class="btn ghost" type="button">เล่นแบบผู้เยี่ยมชม</button>
      <p id="loginMsg" class="muted"></p>
      <p class="legal"><a href="privacy.html" target="_blank" rel="noopener">นโยบายความเป็นส่วนตัว</a> · <a href="terms.html" target="_blank" rel="noopener">ข้อตกลงการใช้งาน</a></p>
    </div>
  </section>
  <section id="scrHome" class="scr" hidden>
    <header class="topbar"><button class="who whoBtn" id="btnProfile" type="button" aria-label="โปรไฟล์ผู้เล่น"><span class="av" id="pAv"></span><span class="whoTxt"><span id="pName">ผู้เล่น</span><small id="pCL">ระดับคอลเลกชัน 1</small></span></button><div class="bia" title="เบี้ย"><span class="shell">◖</span><b id="pBia">0</b></div><div class="snd"><button class="mini btnMusic" type="button" aria-label="เปิด/ปิดเพลง">♪</button><button class="mini btnNext" type="button" aria-label="เปลี่ยนเพลง">⟳</button><button class="mini btnSfx" type="button" aria-label="เปิด/ปิดเสียงเอฟเฟกต์">🔊</button></div><button id="btnLogout" class="mini" type="button">ออก</button></header>
    <div class="homeHero">
      <div class="logo sm"><span class="l1">ล้านนา</span><span class="l2">SNAP</span></div>
      <div id="homeDeckPreview" class="deckStrip"></div>
      <button id="btnPlay" class="btn play" type="button">เล่นกับ AI</button>
      <button class="homeRank" id="homeRank" type="button" data-go="scrBoard" aria-label="ตารางอันดับ"></button>
      <div class="onlineRow"><button class="btn snap" id="btnRanked" type="button">แมตช์แรงค์</button><button class="btn ghost" id="btnRoom" type="button">ห้องเพื่อน</button></div>
    </div>
  </section>
  <section id="scrDeck" class="scr" hidden>
    <header class="topbar"><button class="mini" data-go="scrHome" type="button">‹ กลับ</button><div class="who"><span>เด็คของฉัน</span><small id="deckCount">0/12</small></div><button id="btnAutoDeck" class="mini" type="button">จัดให้</button></header>
    <div id="deckSlots" class="deckSlots"></div>
    <div id="deckFilter" class="filters"></div>
    <div id="deckPool" class="grid"></div>
  </section>
  <section id="scrColl" class="scr" hidden>
    <header class="topbar"><button class="mini" data-go="scrHome" type="button">‹ กลับ</button><div class="who"><span>คอลเลกชัน</span><small id="collCount"></small></div><div class="bia"><span class="shell">◖</span><b class="biaMirror">0</b></div></header>
    <div id="collFilter" class="filters"></div>
    <div id="collGrid" class="grid"></div>
  </section>
  <section id="scrProfile" class="scr" hidden>
    <header class="topbar"><button class="mini" data-go="scrHome" type="button">‹ กลับ</button><div class="who"><span>โปรไฟล์ผู้เล่น</span><small id="profSub"></small></div></header>
    <div id="profBody" class="profile"></div>
  </section>
  <section id="scrBoard" class="scr" hidden>
    <header class="topbar"><button class="mini" data-go="scrHome" type="button">‹ กลับ</button><div class="who"><span>ตารางอันดับ</span><small id="boardSub">100 อันดับแรก · แต้มแรงค์</small></div><button class="mini" id="boardRefresh" type="button" aria-label="รีเฟรช">↻</button></header>
    <div id="boardBody" class="lboard"></div>
    <div id="boardMe" class="boardMe" hidden></div>
  </section>
  <section id="scrShop" class="scr" hidden>
    <header class="topbar"><button class="mini" data-go="scrHome" type="button">‹ กลับ</button><div class="who"><span>กาดล้านนา · ร้านค้า</span><small id="shopDay"></small></div><div class="bia"><span class="shell">◖</span><b class="biaMirror">0</b></div></header>
    <div id="shopBody" class="shop"></div>
  </section>
  <section id="scrMatch" class="scr" hidden>
    <div class="mTop"><div class="opp"><span id="oppName">AI</span><small id="trackName" class="trackName"></small></div><div class="snd"><button class="mini btnMusic" type="button" aria-label="เปิด/ปิดเพลง">♪</button><button class="mini btnSfx" type="button" aria-label="เปิด/ปิดเสียงเอฟเฟกต์">🔊</button></div><div class="stakeBox"><div id="cubes" class="cubes">1</div><small id="stakeLbl"></small></div><button id="btnRetreat" class="mini" type="button">ถอย</button></div>
    <div id="coach" class="coach" hidden></div>
    <div class="arena">
      <div id="templeSlot" class="templeSlot"><span class="tsLabel">ช่องวัด</span><div class="tsCard"></div></div>
      <div id="board" class="board"></div>
    </div>
    <div class="mBottom">
      <div id="hand" class="hand"></div>
      <div class="actions"><div class="energy"><span id="energy">1</span><small>พลังงาน</small></div><button id="btnSnap" class="btn snap" type="button">สแนป</button><button id="btnEnd" class="btn end" type="button">จบเทิร์น <span id="turnLbl">1/6</span></button></div>
    </div>
    <div id="toast" class="toast" hidden></div>
  </section>
  <nav class="tabs" id="mainNav" hidden aria-label="เมนูหลัก"><button data-go="scrHome" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>หน้าหลัก</span></button><button data-go="scrDeck" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="11" height="15" rx="2"/><path d="M9 3h9a2 2 0 0 1 2 2v13"/></svg><span>เด็ค</span></button><button data-go="scrColl" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span>คอลเลกชัน</span></button><button data-go="scrShop" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5 11h-13z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg><span>ร้านค้า</span></button><button data-go="scrProfile" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-7 8-7s7 2.5 8 7"/></svg><span>โปรไฟล์</span></button></nav>
  <div id="modal" class="modal" hidden><div class="mBox"><button class="mClose" type="button" aria-label="ปิด">✕</button><div id="mBody"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="src/cards.js"></script>
<script src="src/cards2.js"></script>
<script src="src/engine.js"></script>
<script src="src/audio.js"></script>
<script src="src/fx.js"></script>
<script src="src/app.js"></script>
</body>
</html>
